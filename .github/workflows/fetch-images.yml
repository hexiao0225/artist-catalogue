name: Fetch study images
on:
  push:
    branches: [image-fetch]
    paths: [scripts/scrape-pages.mjs, scripts/pages.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/scrape-pages.mjs
      - run: |
          git config user.name "image-fetch-bot"
          git config user.email "actions@github.com"
          git add discovery3
          git commit -m "Fetched images [skip ci]" || echo nothing
          git push
